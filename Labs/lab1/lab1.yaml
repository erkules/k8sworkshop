---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
#kind: ClusterRoleBinding
metadata:
  name: application-reader
  namespace: lab1
subjects:
  - kind: ServiceAccount
    name: lab-client
    namespace: lab1
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin

