apiVersion: v1
kind: Namespace
metadata:
  name: lab1

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: lab-client
  namespace: lab1

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: public-config
  namespace: lab1
data:
  message: "Diese ConfigMap darf gelesen werden."

---
apiVersion: v1
kind: Secret
metadata:
  name: protected-secret
  namespace: lab1
type: Opaque
stringData:
  flag: "Diese Information darf lab-client nicht lesen."

