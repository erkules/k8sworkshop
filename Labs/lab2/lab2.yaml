apiVersion: v1
kind: Namespace
metadata:
  name: lab2
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gitlab-job
  namespace: lab2
---
# Hups der #howdareyou
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: gitlab-job-cluster-admin
subjects:
  - kind: ServiceAccount
    name: gitlab-job
    namespace: lab2
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
---
apiVersion: v1
kind: Pod
metadata:
  name: 
  namepace: lab2
    spec:
      serviceAccountName: gitlab-job
      containers:
        - name: job
          image: alpine
          command:
            - sh
            - -c
            - "trap 'exit 0' TERM INT; while true; do sleep 3600; done"
